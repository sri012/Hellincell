name: Update Channels
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json
      - name: Download deps
        run: |
          curl -L -o iptv_channels.json https://iptv-org.github.io/api/channels.json
          curl -L -o iptv_logos.json    https://iptv-org.github.io/api/logos.json
          curl -L -o iptv_feeds.json    https://iptv-org.github.io/api/feeds.json
          curl -L -o jiotv.json "https://jiotv.data.cdn.jio.com/apis/v1.3/getMobileChannelList/get/?os=android&devicetype=phone&usertype=JIO&version=340&langId=6"
      - name: Run scrapper
        run: php scrapper.php
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add channels_data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update $(date -u +%Y-%m-%d)"
          git push
